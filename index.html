<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Website</title>
</head>
<body>
    <header>
        <h1>Welcome to the Car Price Website</h1>
    </header>
    <main>
        <section>
            <h2>Find Your Car</h2>
            <form>
                <label for="car-brand">Brand:</label>
                <input type="text" id="car-brand" name="car-brand" required>
                <label for="car-model">Model:</label>
                <input type="text" id="car-model" name="car-model" required>
                <input type="submit" value="Search">
            </form>
        </section>
        <section id="results">
            <h2>Results</h2>
            <!-- Results will be displayed here -->
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Car Price Website</p>
    </footer>
</body>
</html>
